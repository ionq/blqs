# Workspace root for the blqs monorepo. This is a virtual project (no
# [project] table): it is not published itself, it only groups the two
# distributions `blqs` and `blqs-cirq` and holds shared dev tooling + config.
#
# Common commands (run from this directory):
#   uv sync                  # create .venv, install both packages editable + dev deps
#   uv run pytest            # run the test suite for both packages (with coverage gate)
#   uv run ruff check        # lint
#   uv run ruff format       # format
#   uv run ty check          # type check

[tool.uv.workspace]
members = ["blqs", "blqs_cirq"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.14",
    "ty>=0.0.1a1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# testing_samples.py is excluded from lint AND format: its tests assert exact
# line numbers, so reformatting or re-sorting imports would shift them and
# break the traceback/line-map tests (see the header comment in that file).
extend-exclude = ["**/testing_samples.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Tutorial notebooks use deliberately loose demo code (install-guard imports,
# demo loop variables); don't lint them. Formatting is still checked.
exclude = ["*.ipynb"]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports the public API; those imports are intentional.
"__init__.py" = ["F401"]
# Tests deliberately exercise dynamic dispatch and AST rewriting: type(...) ==
# comparisons (E721), loose zip (B905), and names that only exist after build()
# rewrites the function body (F821).
"*_test.py" = ["E721", "B905", "F821"]
# `I` is the identity gate (a quantum-computing convention), not an ambiguous name.
"**/gates.py" = ["E741"]

[tool.pytest.ini_options]
testpaths = ["blqs", "blqs_cirq"]
addopts = "--cov=blqs --cov=blqs_cirq --cov-report=term-missing --cov-fail-under=99"

[tool.coverage.run]
branch = true
omit = ["*_test.py", "*/testing_samples.py"]

[tool.coverage.report]
exclude_also = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ty.environment]
python-version = "3.11"
root = ["blqs", "blqs_cirq"]

# Test files are excluded deliberately: they exercise the dynamic DSL (calling
# CirqBlqsOp wrappers, blqs-rewritten function bodies), which ty cannot model
# statically - including them yields ~300 structural false positives. Tests
# stay covered by ruff lint and the 99% runtime coverage gate.
[tool.ty.src]
exclude = ["**/*_test.py", "**/testing_samples.py", "**/*.ipynb"]

# blqs's build rewrite manipulates gast's dynamically-generated AST node classes
# (gast.FunctionDef, gast.Name, node.body, ...). gast ships no usable types, so
# those members are invisible to static analysis. Scope the unavoidable noise to
# the AST-manipulation modules only.
[[tool.ty.overrides]]
include = ["blqs/blqs/build.py", "blqs/blqs/decorators.py", "blqs/blqs/_template.py"]
[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
not-subscriptable = "ignore"
