# Workspace root for the blqs monorepo. This is a virtual project (no
# [project] table): it is not published itself, it only groups the two
# distributions `blqs` and `blqs-cirq` and holds shared dev tooling.
#
# Common commands (run from this directory):
#   uv sync            # create .venv and install both packages editable + dev deps
#   uv run pytest      # run the test suite for both packages

[tool.uv.workspace]
members = ["blqs", "blqs_cirq"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
testpaths = ["blqs", "blqs_cirq"]
